<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — S M Mahfujur Rahman</title>
    <!-- Soft 404s dilute crawl budget. This page is explicitly noindex so Google drops it. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
            color: #18181b;
        }
        main { max-width: 32rem; text-align: center; }
        .code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .75rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: #71717a;
        }
        h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); font-weight: 600; margin: .75rem 0 .5rem; letter-spacing: -.02em; }
        p { color: #52525b; line-height: 1.6; margin: 0 0 2rem; }
        a.btn {
            display: inline-block;
            padding: .875rem 2rem;
            border-radius: .5rem;
            background: #18181b;
            color: #fafafa;
            text-decoration: none;
            font-size: .875rem;
            font-weight: 500;
            transition: background .2s;
        }
        a.btn:hover { background: #3f3f46; }
        @media (prefers-color-scheme: dark) {
            body { background: #09090b; color: #fafafa; }
            p { color: #a1a1aa; }
            a.btn { background: #fafafa; color: #09090b; }
            a.btn:hover { background: #d4d4d8; }
        }
    </style>
</head>

<body>
    <main>
        <p class="code">Error 404</p>
        <h1>This page doesn't exist</h1>
        <p>The link may be outdated or mistyped. Everything lives on the main portfolio page.</p>
        <a class="btn" href="/">Back to the portfolio</a>
    </main>
</body>

</html>
